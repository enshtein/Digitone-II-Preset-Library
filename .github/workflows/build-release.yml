name: Build standalone applications

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: Digitone-II-Preset-Library-Windows
          - os: macos-14
            label: macOS-Apple-Silicon
            artifact: Digitone-II-Preset-Library-macOS-Apple-Silicon
          - os: macos-15-intel
            label: macOS-Intel
            artifact: Digitone-II-Preset-Library-macOS-Intel
          - os: ubuntu-22.04
            label: Linux-x86_64
            artifact: Digitone-II-Preset-Library-Linux-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Build standalone executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --console
          --name "Digitone II Preset Library"
          --collect-all textual
          digitone_preset_library.py

      - name: Test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "dist/Digitone II Preset Library.exe" --help'

      - name: Test Unix executable
        if: runner.os != 'Windows'
        run: '"dist/Digitone II Preset Library" --help'

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release
          Copy-Item "dist/Digitone II Preset Library.exe" "release/${{ matrix.artifact }}.exe"

      - name: Package Unix build
        if: runner.os != 'Windows'
        run: |
          mkdir -p release/package
          cp "dist/Digitone II Preset Library" "release/package/Digitone II Preset Library"
          cp README.md "release/package/README.md"
          chmod +x "release/package/Digitone II Preset Library"
          tar -C release/package -czf "release/${{ matrix.artifact }}.tar.gz" .
          rm -rf release/package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all platform builds
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create release and upload applications
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --title "Digitone II Preset Library ${GITHUB_REF_NAME}"
